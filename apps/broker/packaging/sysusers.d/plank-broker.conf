# PLANK broker service accounts (systemd-sysusers).
g plank-broker        -
# Members may reach the optional admin socket (the admin API user is added by the deployer).
g plank-admin-api     -
u plank-broker        -:plank-broker "PLANK broker API"   /var/lib/plank-broker /sbin/nologin
u plank-broker-relay  -:plank-broker "PLANK broker relay" -                     /sbin/nologin
